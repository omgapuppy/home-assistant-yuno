name: CI

on:
  pull_request:
  push:
    branches:
      - "codex/**"
      - "feature/**"
      - "fix/**"
      - main

permissions:
  contents: read

jobs:
  checks:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy custom_components tests scripts
      - name: Test
        run: pytest

  test:
    name: test
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Verify test matrix
        env:
          MATRIX_RESULT: ${{ needs.checks.result }}
        run: test "${MATRIX_RESULT}" = "success"
